# Reusable workflow: build every image declared by the application Bicep.
#
# Each Bicep parameter annotated with
#   @metadata({ radius: { build: { context: '<dir>', dockerfile?: '<file>', platforms?: [...], name?: '<repo>' } } })
# is built once per platform on a native runner, pushed by digest, and merged into
# a multi-arch manifest list. The `parameters` output maps each parameter name to
# its `<repository>@sha256:<digest>` reference for `rad deploy`.
name: Build images

on:
  workflow_call:
    inputs:
      template:
        description: Path to the application Bicep file.
        type: string
        required: true
      platforms:
        description: Comma-separated default platforms for images whose metadata sets none.
        type: string
        default: linux/amd64,linux/arm64
      registry:
        description: Repository prefix for pushed images. Defaults to ghcr.io/<owner>/<repo>.
        type: string
        default: ''
      arm64-runner:
        description: Runner for linux/arm64 builds. Set to ubuntu-24.04 to build under QEMU where arm64 runners are unavailable.
        type: string
        default: ubuntu-24.04-arm
    outputs:
      parameters:
        description: JSON object mapping Bicep parameter names to image digest references.
        value: ${{ jobs.merge.outputs.parameters }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      images: ${{ steps.plan.outputs.images }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Plan image builds
        id: plan
        uses: ./.github/actions/build-images/plan
        with:
          template: ${{ inputs.template }}
          registry: ${{ inputs.registry }}
          platforms: ${{ inputs.platforms }}
          arm64-runner: ${{ inputs.arm64-runner }}

  build:
    name: Build ${{ matrix.name }} (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.emulate
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          outputs: type=image,name=${{ matrix.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          provenance: false

      - name: Record digest
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/$NAME"
          touch "$RUNNER_TEMP/digests/$NAME/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      parameters: ${{ steps.merge.outputs.parameters }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          short="${SHA:0:12}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            tags="pr-${PR_NUMBER} sha-${short}"
          else
            tags="sha-${short} $(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Merge manifests
        id: merge
        uses: ./.github/actions/build-images/merge
        with:
          images: ${{ needs.plan.outputs.images }}
          digests-dir: ${{ runner.temp }}/digests
          tags: ${{ steps.tags.outputs.tags }}

      - name: Upload deploy parameters
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-parameters
          path: ${{ steps.merge.outputs.parameters-file }}
          if-no-files-found: error
