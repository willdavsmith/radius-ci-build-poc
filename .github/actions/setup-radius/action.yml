# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
---
# Ephemeral Radius control plane on the runner, modeled on ai-extensions'
# setup-control-plane action. Unlike that action it does NOT enable BuildKit:
# images are built by the build-images workflow before deploy.
name: Radius - Set up control plane
description: Create an ephemeral k3d cluster on the runner, install Radius, and create an environment.

inputs:
  target-kubeconfig:
    description: Optional kubeconfig of an external cluster that application resources deploy to.
    required: false
    default: ''
  environment:
    description: Radius environment name.
    required: true
  kubernetes-namespace:
    description: Namespace the environment deploys application resources into.
    required: true

runs:
  using: composite
  steps:
    - name: Install k3d
      shell: bash
      env:
        K3D_VERSION: v5.9.0
        K3D_INSTALL_SHA256: 0f6bd9a3ab8ea8625843b21657a6538f117975bb2823b73200dc8b92ccc626de
      run: |
        curl -sSL "https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh" -o install-k3d.sh
        echo "${K3D_INSTALL_SHA256}  install-k3d.sh" | sha256sum -c -
        TAG="${K3D_VERSION}" bash install-k3d.sh
        rm -f install-k3d.sh

    - name: Create control-plane cluster
      shell: bash
      run: |
        k3d cluster create radius-cp --k3s-arg "--disable=traefik@server:*" --wait
        kubectl wait --for=condition=Ready node --all --timeout=120s

    - name: Install Radius CLI
      shell: bash
      env:
        RADIUS_INSTALL_REF: v0.61.1
        RADIUS_INSTALL_SHA256: bf2fdf0248b39ac2a0222326f8458824924872816737a08af3558bddd16c392b
      run: |
        curl -sSL "https://raw.githubusercontent.com/radius-project/radius/${RADIUS_INSTALL_REF}/deploy/install.sh" -o install-rad.sh
        echo "${RADIUS_INSTALL_SHA256}  install-rad.sh" | sha256sum -c -
        /bin/bash install-rad.sh --version "$RADIUS_INSTALL_REF"
        rm -f install-rad.sh
        rad version

    - name: Install Radius
      shell: bash
      env:
        TARGET_KUBECONFIG: ${{ inputs.target-kubeconfig }}
      run: |
        TARGET_FLAGS=()
        if [ -n "$TARGET_KUBECONFIG" ]; then
          kubectl create namespace radius-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic target-kubeconfig \
            --namespace radius-system \
            --from-file=kubeconfig="$TARGET_KUBECONFIG" \
            --dry-run=client -o yaml | kubectl apply -f -
          TARGET_FLAGS+=(--set global.targetCluster.enabled=true)
        fi
        # The dashboard image is published for amd64 only and isn't needed in CI.
        rad install kubernetes \
          --set rp.publicEndpointOverride=localhost \
          --set dashboard.enabled=false \
          "${TARGET_FLAGS[@]}"
        kubectl wait --for=condition=Available deployment --all -n radius-system --timeout=300s

    - name: Create environment
      shell: bash
      env:
        ENV_NAME: ${{ inputs.environment }}
        KUBE_NAMESPACE: ${{ inputs.kubernetes-namespace }}
      run: |
        for i in $(seq 1 30); do
          if rad group create default; then break; fi
          echo "UCP not ready yet (attempt $i); retrying in 10s"
          sleep 10
        done
        rad workspace create kubernetes default --group default --force
        # rad env create validates that the namespace exists. With a target cluster
        # the caller creates it there; it is created on the control plane either way.
        kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
        rad env create "$ENV_NAME" --preview --kubernetes-namespace "$KUBE_NAMESPACE"
        rad env switch "$ENV_NAME" --preview
